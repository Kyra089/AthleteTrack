name: Deploy ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  semak:
    name: Semak sintaks PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: php -l semua fail PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  deploy:
    name: Deploy
    needs: semak
    runs-on: ubuntu-latest
    steps:
      - name: SSH ke VPS dan kemas kini kod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/fyp
            git pull --ff-only origin main
            # Folder muat naik tidak di-commit; pastikan wujud dan boleh ditulis oleh pelayan web.
            mkdir -p uploads/bukti uploads/poster
            chmod -R 775 uploads
            # Fail konfigurasi rahsia dicipta sekali secara manual di pelayan (lihat README).
            test -f db.php || echo "AMARAN: db.php tiada di pelayan. Salin daripada db.example.php."
            test -f config-emel.php || echo "AMARAN: config-emel.php tiada di pelayan. Salin daripada config-emel.example.php."
